# Builds and tests every push / pull request; a "v*" tag publishes a signed APK
# as a GitHub release (the app's update check reads those releases).
name: Android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests of every module that has them: the Android modules (app, host-android) run
      # testDebugUnitTest, the JVM modules (extensions, api-spotify, host-cdp) run test.
      # The live tests in host-cdp skip themselves without a browser to drive.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api-spotify:test :host-cdp:test

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: celestify-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous tag, for a beta's notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.CELESTIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::Signing is local. Attach the verified APK to this tag's release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/celestify.jks"
          fi

      - name: Build and verify signed release
        if: steps.signing.outputs.ready == 'true'
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/celestify.jks
          MYSPOTI_KEYSTORE_PASSWORD: ${{ secrets.CELESTIFY_KEYSTORE_PASSWORD }}
          MYSPOTI_KEY_ALIAS: ${{ secrets.CELESTIFY_KEY_ALIAS }}
          MYSPOTI_KEY_PASSWORD: ${{ secrets.CELESTIFY_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-beta[.][0-9]+)?$ ]]
          ./gradlew :app:assembleRelease -PappVersionName="$VERSION" -PupdateRepo="$GITHUB_REPOSITORY"
          cd app/build/outputs/apk/release
          APK="Celestify-$VERSION.apk"
          mv app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -Fi 'certificate SHA-256 digest: 59ca6698986db2eaf412b803ecb40842e2c71da0b347d4ba7e0eb433f7258468'
          sha256sum "$APK" > "$APK.sha256"

      - uses: softprops/action-gh-release@v3
        if: steps.signing.outputs.ready == 'true'
        with:
          files: |
            base/app/build/outputs/apk/release/Celestify-*.apk
            base/app/build/outputs/apk/release/Celestify-*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          make_latest: ${{ contains(github.ref_name, '-beta.') && 'false' || 'true' }}
