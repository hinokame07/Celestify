
name: Celestify iOS Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "IOS/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "IOS/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Celestify iOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Validate project
        run: |
          set -euo pipefail

          test -d IOS/Celestify.xcodeproj
          test -f IOS/project.yml

          xcodebuild -list \
            -project IOS/Celestify.xcodeproj

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          xcodebuild -resolvePackageDependencies \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail

          xcodebuild build \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit and UI tests
        run: |
          set -euo pipefail

          xcodebuild test \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build/Tests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release for iOS
        run: |
          set -euo pipefail

          xcodebuild build \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/Release/Build/Products/Release-iphoneos/Celestify.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Celestify.app was not generated."
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          /usr/bin/zip -r Celestify-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Celestify-iOS-Unsigned
          path: build/Celestify-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Celestify-Build-Logs
          path: |
            build/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
