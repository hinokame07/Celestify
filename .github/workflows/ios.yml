name: Celestify iOS Build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celestify-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Celestify for iOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # 1. Baixar o repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verificar o Xcode
      - name: Check Xcode installation
        shell: bash
        run: |
          set -euo pipefail

          echo "Developer directory:"
          xcode-select -p

          echo "Xcode version:"
          xcodebuild -version

          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"

          if [[ "$XCODE_VERSION" != 26.* ]]; then
            echo "::error::Xcode 26 is required. Found: $XCODE_VERSION"
            exit 1
          fi

      # 3. Verificar arquivos
      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          test -d IOS
          test -f IOS/project.yml

          echo "Project files:"
          find IOS -maxdepth 2 -type f | sort | head -200

      # 4. Instalar XcodeGen
      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      # 5. Gerar projeto Xcode
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          cd IOS

          xcodegen generate --spec project.yml

          test -d Celestify.xcodeproj

          echo "Xcode project generated successfully."

      # 6. Preparar diretórios
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/logs
          mkdir -p build/ipa/Payload

      # 7. Verificar scheme e dependências
      - name: Resolve project dependencies
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/logs

          echo "=== PROJECT SCHEMES ==="

          xcodebuild -list \
            -project IOS/Celestify.xcodeproj \
            2>&1 | tee build/logs/project-list.log

          echo "=== RESOLVING DEPENDENCIES ==="

          set +e

          xcodebuild -resolvePackageDependencies \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify \
            > build/logs/dependencies.log 2>&1

          RESULT=$?

          set -e

          cat build/logs/dependencies.log

          echo "Dependency resolution exit code: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Dependency resolution failed."
            exit "$RESULT"
          fi

          echo "=== DEPENDENCIES RESOLVED SUCCESSFULLY ==="

      # 8. Compilar para iPhone
      - name: Build iOS Release
        shell: bash
        run: |
          set -euo pipefail

          echo "=== BUILDING CELESTIFY ==="

          xcodebuild \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build/logs/iphoneos-build.log

          echo "=== BUILD COMPLETED ==="

      # 9. Localizar aplicativo
      - name: Locate compiled app
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos"

          echo "Searching for compiled app..."

          APP_PATH="$(find "$PRODUCTS" \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::Compiled application not found."

            ls -lah "$PRODUCTS" || true

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Application found:"
          ls -lah "$APP_PATH"

          INFO_PLIST="$APP_PATH/Info.plist"
          LAUNCH_STORYBOARD="$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$INFO_PLIST")"

          if [[ "$LAUNCH_STORYBOARD" != "LaunchScreen" ]]; then
            echo "::error::The built app does not declare the LaunchScreen storyboard."
            exit 1
          fi

          if [[ ! -d "$APP_PATH/LaunchScreen.storyboardc" \
            && ! -d "$APP_PATH/Base.lproj/LaunchScreen.storyboardc" ]]; then
            echo "::error::The LaunchScreen storyboard was not compiled into the app."
            exit 1
          fi

          echo "Launch screen metadata and compiled storyboard are present."

      # 10. Gerar IPA
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ipa/Payload

          APP_NAME="$(basename "$APP_PATH")"

          ditto "$APP_PATH" \
            "build/ipa/Payload/$APP_NAME"

          ditto -c -k --sequesterRsrc --keepParent \
            build/ipa/Payload \
            build/Celestify-unsigned.ipa

          test -s build/Celestify-unsigned.ipa

          echo "=== IPA GENERATED ==="

          ls -lh build/Celestify-unsigned.ipa

      # 11. Disponibilizar IPA
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Celestify-iOS-Unsigned
          path: build/Celestify-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # 12. Disponibilizar logs
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Celestify-iOS-Build-Logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
