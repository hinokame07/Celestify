name: Celestify
options:
  bundleIdPrefix: app.celestify.ios
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  knownRegions:
    - en
    - Base
    - fr
    - pt-BR

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

targets:
  Celestify:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Celestify
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Configuration/Info.plist
    entitlements:
      path: Configuration/Celestify.entitlements
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "2.4.0"
        CURRENT_PROJECT_VERSION: "240"
        SWIFT_VERSION: "5.10"

  CelestifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CelestifyTests
    dependencies:
      - target: Celestify

  CelestifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CelestifyUITests
    dependencies:
      - target: Celestify
