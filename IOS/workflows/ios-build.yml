
name: Celestify iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "IOS/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify

      - name: Build iOS application
        run: |
          xcodebuild build \
            -project IOS/Celestify.xcodeproj \
            -scheme Celestify \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload

          cp -R \
            build/DerivedData/Build/Products/Release-iphoneos/Celestify.app \
            build/Payload/

          cd build
          zip -r Celestify-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Celestify-iOS-Unsigned
          path: build/Celestify-unsigned.ipa
          retention-days: 7
